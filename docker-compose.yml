version: "3.9"

services:
  phishwatch:
    build: .
    container_name: phishwatch
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - LOG_LEVEL=INFO
      - CERTSTREAM_URL=wss://certstream.calidog.io/
      - OPENSQUAT_SCAN_INTERVAL=1800
    restart: unless-stopped
    volumes:
      - phishwatch-data:/app/data

volumes:
  phishwatch-data:
