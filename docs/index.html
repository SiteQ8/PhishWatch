<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishWatch — Real-time Phishing Detection Platform (Demo)</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
:root{--bg-0:#0a0e17;--bg-1:#0f1520;--bg-2:#151d2e;--bg-3:#1a243a;--bg-4:#1f2d47;--border:#1e2a42;--border-light:#263350;--text-0:#f0f4fc;--text-1:#c4cedf;--text-2:#7a8baa;--text-3:#4a5a78;--accent:#3b82f6;--accent-dim:#2563eb;--accent-glow:rgba(59,130,246,.15);--red:#ef4444;--red-dim:rgba(239,68,68,.12);--orange:#f97316;--orange-dim:rgba(249,115,22,.12);--amber:#eab308;--amber-dim:rgba(234,179,8,.12);--green:#22c55e;--green-dim:rgba(34,197,94,.12);--teal:#06b6d4;--teal-dim:rgba(6,182,212,.12);--font-mono:'JetBrains Mono','Fira Code',monospace;--font-sans:'Space Grotesk',system-ui,sans-serif;--r:8px;--rl:12px;--t:180ms ease}*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}html{font-size:14px}body{font-family:var(--font-sans);background:var(--bg-0);color:var(--text-1);line-height:1.55;overflow-x:hidden;min-height:100vh}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.sidebar{background:var(--bg-1);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.25rem 0}
.sidebar__logo{display:flex;align-items:center;gap:.75rem;padding:0 1.25rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),#6366f1);border-radius:var(--r);display:grid;place-items:center;color:#fff;flex-shrink:0}
.sidebar__logo h1{font-size:1.15rem;font-weight:700;color:var(--text-0);letter-spacing:-.02em}
.version{font-size:.7rem;color:var(--text-3);font-family:var(--font-mono)}
.sidebar__nav{flex:1;padding:0 .75rem}
.nav-item{display:flex;align-items:center;gap:.7rem;padding:.6rem .75rem;border-radius:var(--r);color:var(--text-2);text-decoration:none;font-size:.9rem;font-weight:500;transition:var(--t);margin-bottom:2px;cursor:pointer}
.nav-item:hover{background:var(--bg-3);color:var(--text-0)}
.nav-item.active{background:var(--accent-glow);color:var(--accent)}
.nav-item.active svg{stroke:var(--accent)}
.sidebar__status{padding:1rem 1.25rem;border-top:1px solid var(--border);margin-top:auto}
.status-badge{display:flex;align-items:center;gap:.5rem;font-size:.8rem;margin-bottom:.75rem;color:var(--text-2)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.btn-demo{width:100%;padding:.55rem;border:1px solid var(--accent-dim);background:var(--accent-glow);color:var(--accent);font-family:var(--font-sans);font-weight:600;font-size:.85rem;border-radius:var(--r);cursor:default}
.sidebar__footer{padding:.75rem 1.25rem 0;font-size:.7rem;color:var(--text-3)}
.sidebar__footer a{color:var(--accent);text-decoration:none}
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.5rem;border-bottom:1px solid var(--border);background:var(--bg-1);flex-shrink:0}
.topbar h2{font-size:1.1rem;font-weight:600;color:var(--text-0)}
.demo-badge{background:var(--accent-glow);color:var(--accent);padding:.25rem .75rem;border-radius:20px;font-size:.75rem;font-weight:600;font-family:var(--font-mono)}
.content{flex:1;overflow-y:auto;padding:1.25rem 1.5rem}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.25rem}
.stat-card{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--rl);padding:1rem 1.15rem;display:flex;align-items:center;gap:.85rem;transition:var(--t)}
.stat-card:hover{border-color:var(--border-light)}
.stat-card--critical{border-left:3px solid var(--red)}
.stat-card--high{border-left:3px solid var(--orange)}
.stat-card__icon{width:42px;height:42px;border-radius:var(--r);display:grid;place-items:center;flex-shrink:0}
.bg-blue{background:var(--accent-glow);color:var(--accent)}
.bg-red{background:var(--red-dim);color:var(--red)}
.bg-orange{background:var(--orange-dim);color:var(--orange)}
.bg-teal{background:var(--teal-dim);color:var(--teal)}
.stat-value{display:block;font-size:1.6rem;font-weight:700;color:var(--text-0);font-family:var(--font-mono);line-height:1.1}
.stat-label{font-size:.78rem;color:var(--text-2);margin-top:2px}
.grid-2col{display:grid;grid-template-columns:1.5fr 1fr;gap:1rem}
.card{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.card__header{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1rem;border-bottom:1px solid var(--border)}
.card__header h3{font-size:.95rem;font-weight:600;color:var(--text-0)}
.filter-row{display:flex;gap:.5rem;align-items:center}
.select-sm{padding:.3rem .6rem;background:var(--bg-3);border:1px solid var(--border);border-radius:var(--r);color:var(--text-1);font-family:var(--font-sans);font-size:.8rem}
.feed{max-height:520px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bg-4) transparent}
.feed-item{display:grid;grid-template-columns:1fr auto;gap:.35rem;padding:.75rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;transition:var(--t)}
.feed-item:hover{background:var(--bg-3)}
.feed-item__domain{font-family:var(--font-mono);font-weight:600;font-size:.88rem;color:var(--text-0);word-break:break-all}
.feed-item__meta{display:flex;gap:.7rem;font-size:.75rem;color:var(--text-2);margin-top:2px;flex-wrap:wrap}
.target-tag{background:var(--accent-glow);color:var(--accent);padding:1px 6px;border-radius:4px;font-weight:600;font-size:.7rem}
.typo-tag{background:var(--orange-dim);color:var(--orange);padding:1px 6px;border-radius:4px;font-weight:600;font-size:.7rem}
.risk-pill{display:inline-flex;align-items:center;justify-content:center;min-width:38px;padding:.2rem .5rem;border-radius:6px;font-family:var(--font-mono);font-weight:700;font-size:.78rem;align-self:center}
.risk-pill--critical{background:var(--red-dim);color:var(--red)}
.risk-pill--high{background:var(--orange-dim);color:var(--orange)}
.risk-pill--medium{background:var(--amber-dim);color:var(--amber)}
.risk-pill--low{background:var(--green-dim);color:var(--green)}
.charts-stack{display:flex;flex-direction:column;gap:1rem}
.card--chart{padding:1rem}
.card--chart h3{font-size:.85rem;color:var(--text-2);margin-bottom:.5rem}
.card--chart canvas{max-height:180px}
.toast-container{position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}
.toast{background:var(--bg-2);border:1px solid var(--red);border-radius:var(--r);padding:.85rem 1rem;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:slideIn .3s ease}
.toast__title{font-weight:700;font-size:.85rem;color:var(--red)}
.toast__domain{font-family:var(--font-mono);font-size:.82rem;color:var(--text-0);margin-top:2px}
.toast__score{font-size:.78rem;color:var(--text-2)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.grid-2col{grid-template-columns:1fr}.stats-row{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar__logo">
                <div class="logo-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4" stroke-linecap="round"/></svg></div>
                <div><h1>PhishWatch</h1><span class="version">v2.0.0</span></div>
            </div>
            <nav class="sidebar__nav">
                <a class="nav-item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Dashboard</a>
                <a class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Detections</a>
                <a class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Threat Intel</a>
                <a class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Analyze</a>
            </nav>
            <div class="sidebar__status"><div class="status-badge"><span class="status-dot"></span><span>Demo Mode</span></div><div class="btn-demo">LIVE DEMO</div></div>
            <div class="sidebar__footer"><span>By <a href="https://github.com/SiteQ8" target="_blank">Ali AlEnezi (SiteQ8)</a></span></div>
        </aside>
        <main class="main">
            <header class="topbar"><h2>Dashboard</h2><span class="demo-badge">DEMO — Simulated Data</span></header>
            <div class="content">
                <div class="stats-row">
                    <div class="stat-card"><div class="stat-card__icon bg-blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div><div><span class="stat-value" id="sTotal">312</span><span class="stat-label">Total Detections</span></div></div>
                    <div class="stat-card stat-card--critical"><div class="stat-card__icon bg-red"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><div><span class="stat-value" id="sCrit">24</span><span class="stat-label">Critical Alerts</span></div></div>
                    <div class="stat-card stat-card--high"><div class="stat-card__icon bg-orange"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><div><span class="stat-value" id="sHigh">67</span><span class="stat-label">High Risk</span></div></div>
                    <div class="stat-card"><div class="stat-card__icon bg-teal"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg></div><div><span class="stat-value">74.1</span><span class="stat-label">Avg Risk Score</span></div></div>
                </div>
                <div class="grid-2col">
                    <div class="card">
                        <div class="card__header"><h3>Live Detection Feed</h3><div class="filter-row"><select class="select-sm"><option>All Risks</option></select><select class="select-sm"><option>All Sources</option></select></div></div>
                        <div class="feed" id="demoFeed"></div>
                    </div>
                    <div class="charts-stack">
                        <div class="card card--chart"><h3>Risk Distribution</h3><canvas id="chartRisk"></canvas></div>
                        <div class="card card--chart"><h3>Detection Timeline</h3><canvas id="chartTimeline"></canvas></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
    const demoDetections = [
        { domain: "paypal-verify-account-secure.tk", score: 96, source: "CertStream", target: "paypal", typo: true, time: "1m ago" },
        { domain: "microsoft-365-password-reset.xyz", score: 94, source: "CertStream", target: "microsoft", typo: false, time: "3m ago" },
        { domain: "amazon-prime-billing-update.click", score: 92, source: "OpenSquat", target: "amazon", typo: true, time: "5m ago" },
        { domain: "chase-bank-login-secure.ml", score: 93, source: "CertStream", target: "chase", typo: false, time: "7m ago" },
        { domain: "apple-id-verify-now.cf", score: 91, source: "CertStream", target: "apple", typo: false, time: "9m ago" },
        { domain: "g00gle-account-security.top", score: 95, source: "OpenSquat", target: "google", typo: true, time: "11m ago" },
        { domain: "netflix-payment-expired.buzz", score: 88, source: "CertStream", target: "netflix", typo: false, time: "13m ago" },
        { domain: "coinbase-wallet-verify.ga", score: 90, source: "CertStream", target: "coinbase", typo: false, time: "15m ago" },
        { domain: "metamask-unlock-wallet.icu", score: 89, source: "OpenSquat", target: "metamask", typo: false, time: "17m ago" },
        { domain: "fedex-tracking-delivery.cam", score: 85, source: "CertStream", target: "fedex", typo: false, time: "19m ago" },
        { domain: "dropbox-shared-document.rest", score: 82, source: "CertStream", target: "dropbox", typo: false, time: "21m ago" },
        { domain: "wellsfarg0-alert-login.tk", score: 94, source: "OpenSquat", target: "wellsfargo", typo: true, time: "23m ago" },
        { domain: "zoom-meeting-invitation.download", score: 81, source: "CertStream", target: "zoom", typo: false, time: "25m ago" },
        { domain: "instagram-verify-badge.ml", score: 79, source: "CertStream", target: "instagram", typo: false, time: "27m ago" },
        { domain: "stripe-payment-failed.cf", score: 86, source: "OpenSquat", target: "stripe", typo: false, time: "29m ago" },
        { domain: "slack-workspace-upgrade.xyz", score: 78, source: "CertStream", target: "slack", typo: false, time: "31m ago" },
        { domain: "usps-package-redelivery.top", score: 83, source: "OpenSquat", target: "usps", typo: false, time: "33m ago" },
        { domain: "okta-sso-verify-identity.ga", score: 87, source: "CertStream", target: "okta", typo: false, time: "35m ago" },
        { domain: "discord-nitro-free-gift.click", score: 80, source: "CertStream", target: "discord", typo: false, time: "37m ago" },
        { domain: "binance-account-suspended.buzz", score: 84, source: "OpenSquat", target: "binance", typo: false, time: "39m ago" },
    ];

    function riskClass(s) { return s >= 90 ? 'critical' : s >= 70 ? 'high' : s >= 50 ? 'medium' : 'low'; }

    const feed = document.getElementById('demoFeed');
    feed.innerHTML = demoDetections.map(d => {
        const typo = d.typo ? '<span class="typo-tag">Typosquat</span>' : '';
        return `<div class="feed-item"><div><div class="feed-item__domain">${d.domain}</div><div class="feed-item__meta"><span>${d.source}</span><span>${d.time}</span><span class="target-tag">${d.target}</span>${typo}</div></div><span class="risk-pill risk-pill--${riskClass(d.score)}">${d.score}</span></div>`;
    }).join('');

    Chart.defaults.color = '#7a8baa'; Chart.defaults.borderColor = '#1e2a42';
    new Chart(document.getElementById('chartRisk'), { type: 'doughnut', data: { labels: ['Critical','High','Medium','Low'], datasets: [{ data: [24,67,38,12], backgroundColor: ['#ef4444','#f97316','#eab308','#22c55e'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 12, font: { size: 11 } } } } } });
    new Chart(document.getElementById('chartTimeline'), { type: 'bar', data: { labels: ['0:00','2:00','4:00','6:00','8:00','10:00','12:00','14:00','16:00','18:00','20:00','22:00'], datasets: [{ label: 'Detections', data: [5,3,2,6,12,18,22,28,24,19,13,8], backgroundColor: '#3b82f6', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: '#1e2a42' } } } } });

    const liveDomains = [
        { domain: "linkedin-profile-verify.tk", score: 86, target: "linkedin" },
        { domain: "aws-console-signin.xyz", score: 91, target: "aws" },
        { domain: "spotify-premium-free.buzz", score: 77, target: "spotify" },
        { domain: "github-2fa-recovery.ml", score: 88, target: "github" },
        { domain: "venmo-payment-pending.click", score: 82, target: "venmo" },
        { domain: "tiktok-creator-fund.ga", score: 79, target: "tiktok" },
        { domain: "cloudflare-security-alert.top", score: 84, target: "cloudflare" },
    ];
    let idx = 0;
    setInterval(() => {
        const d = liveDomains[idx % liveDomains.length]; idx++;
        const el = document.getElementById('sTotal'); el.textContent = parseInt(el.textContent) + 1;
        if (d.score >= 90) { const c = document.getElementById('sCrit'); c.textContent = parseInt(c.textContent) + 1; }
        if (d.score >= 70) { const h = document.getElementById('sHigh'); h.textContent = parseInt(h.textContent) + 1; }
        if (d.score >= 75) {
            const toast = document.createElement('div'); toast.className = 'toast';
            toast.innerHTML = `<div class="toast__title">🚨 ${d.score >= 90 ? 'CRITICAL' : 'HIGH'} Threat</div><div class="toast__domain">${d.domain}</div><div class="toast__score">Score: ${d.score}/100 · Targeting: ${d.target}</div>`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }
        const item = document.createElement('div'); item.className = 'feed-item'; item.style.animation = 'slideIn 0.3s ease';
        item.innerHTML = `<div><div class="feed-item__domain">${d.domain}</div><div class="feed-item__meta"><span>CertStream</span><span>just now</span><span class="target-tag">${d.target}</span></div></div><span class="risk-pill risk-pill--${riskClass(d.score)}">${d.score}</span>`;
        feed.insertBefore(item, feed.firstChild);
    }, 3500);
    </script>
</body>
</html>
